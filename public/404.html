<!doctype html>
<!--
  Cloudflare Pages serves index.html with a 200 for any path it does not have,
  which meant every typed-wrong URL on this domain returned the homepage and
  claimed to be a page. That is a soft 404: search engines see an unbounded
  number of addresses all serving identical content that canonicalises to `/`.

  This file is what makes an unknown path answer 404 and mean it. It also
  restores honest not-found semantics for the `[slug]` Function, which asks the
  asset server whether a path belongs to the site before deciding a shop page
  is missing.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Suite</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#FAF9F6" />
    <style>
      body {
        background: #faf9f6;
        color: #121316;
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0 20px;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 460px; margin: 0 auto; padding: 96px 0; }
      a.brand { font-weight: 800; letter-spacing: -0.03em; text-decoration: none; font-size: 15px; }
      h1 { font-size: 26px; letter-spacing: -0.03em; margin: 28px 0 12px; }
      p { color: #6b7280; font-size: 15px; }
      p + p { margin-top: 14px; }
      a { color: #2563eb; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">Suite</a>
      <h1>Page not found</h1>
      <p>
        There is nothing at this address. If you are looking for a shop's page, the
        address is its name in lowercase with hyphens instead of spaces — for
        example <code>suite.ng/ade-gadgets</code>.
      </p>
      <p><a href="/">Go to the Suite homepage</a></p>
    </main>
  </body>
</html>
