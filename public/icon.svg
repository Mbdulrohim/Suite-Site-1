  <!--
    The bare mark, no tile behind it.

    An SVG favicon can carry its own stylesheet, which is the only way a tab
    icon follows the browser's theme: dark ink on light chrome, light ink on
    dark. A single flat colour is invisible in one of the two, and the black
    square this replaced was only ever legible because it brought its own
    background with it.
  -->
