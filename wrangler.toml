# Cloudflare Pages. The build runs Vite, prerenders each route with a real
# browser, then writes sitemap/robots/llms into the same output directory.
# Must match the Pages project this deploys to. It said "suite-ng" for a while,
# which is not a project on the account — `wrangler pages deployment list` and
# every other project-scoped command failed against it until this was corrected.
name = "suite-site"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

# Waitlist confirmation uses encrypted production secrets (never [vars]):
# SMTP_HOST, SMTP_PORT=465, SMTP_USER, SMTP_PASSWORD, SMTP_FROM_EMAIL, and
# SMTP_SENDER_NAME. Port 465 provides implicit TLS from Pages to Amazon SES.

[[d1_databases]]
binding = "copper-ledger"
database_name = "copper-ledger"
database_id = "c13332c9-cbfa-4b4b-835b-69184d306b68"
